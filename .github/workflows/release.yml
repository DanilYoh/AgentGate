name: Release
run-name: Release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag (for example, v1.2.3)
        required: true
        type: string

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          package-manager-cache: false

      - name: Verify immutable release tag
        run: node scripts/verify-release.mjs "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ inputs.tag }}

      - run: npm ci --ignore-scripts
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run check:action-bundle
      - run: npm run test:action-bundle
      - run: npm run test:package
      - run: npm run dogfood
      - run: npm audit --audit-level=high

      - name: Pack exactly one release tarball
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-artifact
          npm pack --ignore-scripts --pack-destination release-artifact
          mapfile -t tarballs < <(find release-artifact -mindepth 1 -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#tarballs[@]}" -eq 1
          tarball_name="$(basename "${tarballs[0]}")"
          (cd release-artifact && sha256sum "$tarball_name" > "$tarball_name.sha256")
          test "$(find release-artifact -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 2
          test "$(find release-artifact -mindepth 1 -maxdepth 1 | wc -l)" -eq 2

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: release-artifact/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish verified tarball
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: release-artifact

      - name: Verify transferred artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release-artifact -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 2
          test "$(find release-artifact -mindepth 1 -maxdepth 1 | wc -l)" -eq 2
          mapfile -t tarballs < <(find release-artifact -mindepth 1 -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#tarballs[@]}" -eq 1
          checksum="${tarballs[0]}.sha256"
          test -f "$checksum"
          (cd release-artifact && sha256sum --check "$(basename "$checksum")")
          release_version="${RELEASE_TAG#v}"
          test "$RELEASE_TAG" = "v$release_version"
          package_identity="$(tar -xOf "${tarballs[0]}" package/package.json | node -e '
            let source = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { source += chunk; });
            process.stdin.on("end", () => {
              const manifest = JSON.parse(source);
              process.stdout.write(`${String(manifest.name)}@${String(manifest.version)}`);
            });
          ')"
          test "$package_identity" = "@danilyoh/agentgate@$release_version"
        env:
          RELEASE_TAG: ${{ inputs.tag }}

      - name: Publish with npm trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tarballs < <(find release-artifact -mindepth 1 -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#tarballs[@]}" -eq 1
          npm publish "${tarballs[0]}" --ignore-scripts --access public
